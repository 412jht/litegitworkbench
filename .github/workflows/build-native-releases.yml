name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows portable
            os: windows-latest
            artefact: LiteGitWorkbench-Windows-Portable
          - name: Linux x64
            os: ubuntu-22.04
            artefact: LiteGitWorkbench-Linux-X64
          - name: macOS Intel
            os: macos-15-intel
            artefact: LiteGitWorkbench-macOS-Intel
          - name: macOS Apple Silicon
            os: macos-15
            artefact: LiteGitWorkbench-macOS-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev
      - name: Install native build dependencies
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade pip && python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows portable release
        if: runner.os == 'Windows'
        run: python packaging/build_windows_portable.py
      - name: Build native release
        if: runner.os != 'Windows'
        run: python packaging/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefact }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-downloads
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir release-upload
          find release-downloads -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.zip.json' -o -name '*.gz.json' \) -exec cp {} release-upload/ \;
          find release-upload -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > release-upload/SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-upload/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-upload/* --generate-notes --title "LiteGit Workbench $GITHUB_REF_NAME"
          fi
